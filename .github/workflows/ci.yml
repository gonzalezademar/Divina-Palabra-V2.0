name: Next.js CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.14.0'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run lint
      run: npm run lint

    - name: Run typecheck
      run: npm run typecheck

    - name: Build Next.js app
      run: npm run build

    - name: Probar servicio, continuidad y almacenamiento en nube
      run: node --test tests/service.test.mjs tests/catalog-regression.mjs tests/continuity-service.mjs tests/reliability-service.mjs tests/cloud-service.test.mjs

    - name: Comprobar compilación para Vercel
      run: npm run build
      env:
        VERCEL: '1'
